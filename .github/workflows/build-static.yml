name: Build Static Windows Uchardet

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊按鈕觸發編譯

jobs:
  build-windows:
    runs-on: windows-latest # 使用 GitHub 內建的 Windows 環境

    steps:
    # 1. 複製 uchardet 的原始碼
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'TypesettingTools/uchardet' # 指定官方最新儲存庫

    # 2. 設定 MSVC 開發人員命令提示字元環境
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # 3. 建立建置資料夾並透過 CMake 產生靜態編譯組態
    # 關鍵參數說明：
    # -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded：強迫 MSVC 使用 /MT 進行靜態連結
    # -DBUILD_SHARED_LIBS=OFF：關閉動態連結庫(.dll)生成，只產生靜態庫
    - name: Configure CMake
      run: |
        # 使用 PowerShell 的取代功能，直接將最低要求改為 3.5
        (Get-Content CMakeLists.txt) -replace "cmake_minimum_required\(VERSION .*\)", "cmake_minimum_required(VERSION 3.5)" | Set-Content CMakeLists.txt

        # 3.2 物理阻斷：直接用空字串取代掉載入 test 子目錄的指令，徹底讓 MSVC 不去編譯測試專案
        (Get-Content CMakeLists.txt) -replace "add_subdirectory\(test\)", "" | Set-Content CMakeLists.txt

        # 3.3 移除 Windows (MSVC) 下不需要且會報錯的 getopt.h
        (Get-Content src/tools/uchardet.cpp) -replace '#include <getopt.h>', '// #include <getopt.h>' | Set-Content src/tools/uchardet.cpp

        mkdir build
        cd build
        # 關鍵參數：
        # -DCMAKE_CXX_FLAGS="/w /D_CRT_SECURE_NO_WARNINGS" 代表關閉 C++ 所有警告且允許使用舊安全函式
        # -DCMAKE_C_FLAGS="/w /D_CRT_SECURE_NO_WARNINGS" 代表關閉 C 所有警告
        cmake -DCMAKE_BUILD_TYPE=Release `
              -DBUILD_SHARED_LIBS=OFF `
              -DBUILD_TESTING=OFF `
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
              -DCMAKE_CXX_FLAGS="/w /D_CRT_SECURE_NO_WARNINGS" `
              -DCMAKE_C_FLAGS="/w /D_CRT_SECURE_NO_WARNINGS" `
              ..

    # 4. 開始編譯 Release 版本的執行檔
    - name: Build with CMake
      run: |
        cd build
        cmake --build . --config Release

    # 5. 上傳編譯好的獨立靜態 exe 檔案做為 Artifact (供網頁下載)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uchardet-windows-x64-static
        path: build/src/Release/uchardet.exe # 產出的靜態 exe 位置
